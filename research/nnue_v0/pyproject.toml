[project]
name = "pollock-nnue-v0"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "chess==1.11.2",
    "torch==2.11.0",
]

[project.optional-dependencies]
cpu = ["torch; sys_platform == 'win32'"]
cuda = ["torch; sys_platform == 'win32'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
