[project]
name = "pollock-nnue-v0"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "chess==1.11.2",
    "torch==2.11.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
